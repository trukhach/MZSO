name: UI accessibility and responsive checks
on:
  push:
    branches: [main]
  pull_request:
jobs:
  ui-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: test -f out/index.html && test -f out/robots.txt && test -f out/sitemap.xml
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
        env:
          CI: 'true'
